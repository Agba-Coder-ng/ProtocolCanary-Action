name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, lint, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm test

      - name: Test with coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          COVERAGE_TMP=$(mktemp)
          npm run test:coverage -- --reporter=default | tee "$COVERAGE_TMP"
          EXIT_CODE=$?
          {
            echo "### 📊 Code Coverage Summary"
            echo ""
            echo '```'
            cat "$COVERAGE_TMP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$COVERAGE_TMP"
          exit $EXIT_CODE

      - name: Build
        run: npm run build

      - name: Verify committed dist/ matches a fresh build
        shell: bash
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi
